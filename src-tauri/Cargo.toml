[package]
name = "openforge"
version = "0.0.1"
description = "Open Forge - Desktop application for managing AI workflows"
authors = ["OpenCode"]
edition = "2021"
rust-version = "1.95"

[build-dependencies]
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
bytes = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
reqwest = { version = "0.13", features = ["json", "stream", "blocking"] }
which = "6.0"

base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
git2 = { version = "0.21", default-features = false }
futures = "0.3"
dashmap = "6"
dirs = "6"
once_cell = "1"
regex = "1"
ctrlc = "3"
libc = "0.2"
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "de9fd9b0fa4ab53faebd3d489f4c74fe0ec832ec", version = "=0.2.1" }
portable-pty = "0.9"
whisper-rs = { version = "0.15", features = ["metal"] }
hound = "3.5"
sha1 = "0.11"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rand = "0.8"
keyring = { version = "3", features = ["apple-native"] }
rcgen = "0.13"
sha2 = "0.10"
if-addrs = "0.13"
sysinfo = "0.37.2"
subtle = "2.6.1"
mdns-sd = "0.17.1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
jsonschema = { version = "0.33", default-features = false }
tokio-tungstenite = "0.24"

[features]
default = []
