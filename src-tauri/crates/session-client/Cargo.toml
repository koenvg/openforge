[package]
name = "openforge-session-client"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
openforge-session-host = { path = "../session-host" }
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time"] }
openforge-session-protocol = { path = "../session-protocol" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
