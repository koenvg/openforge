[package]
name = "openforge-session-host"
version = "0.1.0"
edition = "2021"

[features]
test-contracts = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
