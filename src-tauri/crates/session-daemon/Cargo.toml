[package]
name = "openforge-session-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
default-run = "openforge-session-daemon"

[features]
replacement-fixtures = []

[[bin]]
name = "openforge-session-daemon-fixture-v2"
path = "src/replacement_fixture_v2.rs"
required-features = ["replacement-fixtures"]

[[bin]]
name = "openforge-session-daemon-fixture-init-fails"
path = "src/replacement_fixture_init_fails.rs"
required-features = ["replacement-fixtures"]

[[bin]]
name = "openforge-session-daemon-fixture-exec-fails"
path = "src/replacement_fixture_exec_fails.rs"
required-features = ["replacement-fixtures"]

[dependencies]
axum = "0.7"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
openforge-session-host = { path = "../session-host" }
base64 = "0.22"
openforge-session-protocol = { path = "../session-protocol" }
openforge-session-client = { path = "../session-client" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
# ARM SHA-256 acceleration keeps bounded image preflights viable for large debug images.
sha2 = { version = "0.10", features = ["asm"] }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
libc = "0.2"
portable-pty = "0.9"
sysinfo = "0.37.2"
tokio = { version = "1", features = ["rt", "time", "net", "sync", "macros", "io-util"] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs.git", rev = "de9fd9b0fa4ab53faebd3d489f4c74fe0ec832ec", version = "=0.2.1" }

[dev-dependencies]
openforge-session-host = { path = "../session-host", features = ["test-contracts"] }
tokio = { version = "1", features = ["macros"] }
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.dev.package.sha2]
# Preflight has production deadlines even in debug builds. Hashing up to 128 MiB
# must not spend that budget executing unoptimized cryptographic rounds.
opt-level = 3
