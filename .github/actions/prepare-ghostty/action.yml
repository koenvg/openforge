name: Prepare Ghostty build dependencies
description: Install pinned Zig and prepare the pinned Ghostty sources and packages for offline Cargo builds

runs:
  using: composite
  steps:
    - name: Install Zig 0.16
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0

    - name: Prepare pinned Ghostty dependencies
      shell: bash
      run: |
        set -o pipefail
        ghostty_prepare_log="$RUNNER_TEMP/ghostty-prepare.log"
        node scripts/prepare-ghostty-vt.mjs | tee "$ghostty_prepare_log"
        grep '^GHOSTTY_' "$ghostty_prepare_log" >> "$GITHUB_ENV"
        echo 'CARGO_NET_OFFLINE=true' >> "$GITHUB_ENV"
