name: Publish Plugin SDK

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish"
        required: true
        default: latest
        type: string
      dry_run:
        description: "Run all checks but skip npm publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @openforge-app/plugin-sdk
    uses: ./.github/workflows/reusable-publish-plugin-sdk.yml
    with:
      npm_tag: ${{ inputs.npm_tag }}
      dry_run: ${{ inputs.dry_run }}
