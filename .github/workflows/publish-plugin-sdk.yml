name: Publish Plugin SDK

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: "npm dist-tag to publish"
        required: true
        default: latest
        type: string
      dry_run:
        description: "Run all checks but skip npm publish"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-plugin-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @openforge-app/plugin-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk build

      - name: Test plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk test

      - name: Check packed Plugin SDK authoring contract
        run: pnpm packages:contract:check

      - name: Check published SDK version
        id: published-sdk
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/plugin-sdk/package.json', 'utf8')).version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@openforge-app/plugin-sdk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@openforge-app/plugin-sdk@$PACKAGE_VERSION is already published; publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace package license metadata
        run: pnpm packages:metadata:check
      - name: Check package contents
        working-directory: packages/plugin-sdk
        run: npm pack --dry-run

      - name: Publish package
        if: inputs.dry_run == false && steps.published-sdk.outputs.published != 'true'
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance --tag "${{ inputs.npm_tag }}"

      - name: Report dry run
        if: inputs.dry_run == true
        run: echo "Dry run completed; npm publish was intentionally skipped."
