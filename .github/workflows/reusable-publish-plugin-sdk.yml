name: Reusable Publish Plugin SDK

on:
  workflow_call:
    inputs:
      package_version:
        description: "Plugin SDK version to publish; a leading v is removed"
        required: false
        default: ""
        type: string
      npm_tag:
        description: "npm dist-tag to publish"
        required: false
        default: latest
        type: string
      dry_run:
        description: "Run all checks but skip npm publish"
        required: false
        default: true
        type: boolean

jobs:
  publish:
    name: Publish @openforge-app/plugin-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    env:
      NPM_TAG: ${{ inputs.npm_tag }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate npm dist-tag
        run: node scripts/npm-dist-tag.mjs

      - name: Set SDK package version
        if: inputs.package_version != ''
        env:
          REQUESTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          VERSION="${REQUESTED_PACKAGE_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semver version: $VERSION" >&2
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v' packages/plugin-sdk/package.json > packages/plugin-sdk/package.json.tmp
          mv packages/plugin-sdk/package.json.tmp packages/plugin-sdk/package.json

      - name: Build plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk build

      - name: Test plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk test

      - name: Check packed Plugin SDK authoring contract
        run: pnpm packages:contract:check

      - name: Check published SDK version
        id: published-sdk
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/plugin-sdk/package.json', 'utf8')).version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@openforge-app/plugin-sdk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@openforge-app/plugin-sdk@$PACKAGE_VERSION is already published; publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace package license metadata
        run: pnpm packages:metadata:check

      - name: Check package contents
        working-directory: packages/plugin-sdk
        run: pnpm pack --dry-run

      - name: Publish package
        if: inputs.dry_run == false && steps.published-sdk.outputs.published != 'true'
        working-directory: packages/plugin-sdk
        run: pnpm publish --no-git-checks --access public --provenance --tag "$NPM_TAG"

      - name: Report dry run
        if: inputs.dry_run == true
        run: echo "Dry run completed; npm publish was intentionally skipped."
