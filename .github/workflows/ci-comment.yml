name: CI Comment

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  comment:
    name: Post CI Results
    timeout-minutes: 10
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prs = context.payload.workflow_run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log('No PR associated with this workflow run');
              return;
            }
            core.setOutput('number', prs[0].number);

      - name: Download frontend logs
        if: steps.pr.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });

            for (const name of ['frontend-logs', 'frontend-results', 'rust-logs', 'rust-results']) {
              const artifact = artifacts.data.artifacts.find(a => a.name === name);
              if (artifact) {
                const download = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                fs.writeFileSync(`/tmp/${name}.zip`, Buffer.from(download.data));
              }
            }

      - name: Extract artifacts
        if: steps.pr.outputs.number
        run: |
          mkdir -p /tmp/frontend-logs /tmp/frontend-results /tmp/rust-logs /tmp/rust-results
          for name in frontend-logs frontend-results rust-logs rust-results; do
            if [ -f "/tmp/${name}.zip" ]; then
              unzip -o "/tmp/${name}.zip" -d "/tmp/${name}" || true
            fi
          done

      - name: Post or clean CI comments
        if: steps.pr.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt('${{ steps.pr.outputs.number }}');

            function describeError(error) {
              return error instanceof Error ? `${error.name}: ${error.message}` : String(error);
            }

            function isMissingFile(error) {
              return error && typeof error === 'object' && error.code === 'ENOENT';
            }

            function readExitCodeFile(path, label) {
              try {
                return fs.readFileSync(path, 'utf8').trim() !== '0';
              } catch (error) {
                if (isMissingFile(error)) {
                  core.info(`${label} exit code file was not found at ${path}; assuming that check did not fail.`);
                } else {
                  core.warning(`Unable to read ${label} exit code file at ${path}; assuming that check did not fail. ${describeError(error)}`);
                }
                return false;
              }
            }

            function renderFrontendComment(typecheckFailed, testsFailed) {
              let body = '## ❌ Frontend CI Failures\n\n';

              if (typecheckFailed) {
                try {
                  const log = fs.readFileSync('/tmp/frontend-logs/typecheck.log', 'utf8');
                  const errors = log.split('\n').filter(l => l.includes('error TS')).join('\n');
                  body += '### Type Check\n\n```\n' + (errors || log).slice(0, 30000) + '\n```\n\n';
                } catch (error) {
                  core.warning(`Unable to read frontend typecheck log: ${describeError(error)}`);
                  body += '### Type Check\n\n_Failed (logs unavailable)_\n\n';
                }
              }

              if (testsFailed) {
                try {
                  const log = fs.readFileSync('/tmp/frontend-logs/tests.log', 'utf8');
                  const lines = log.split('\n');
                  const tail = lines.slice(Math.max(0, lines.length - 200)).join('\n');
                  body += '### Tests\n\n```\n' + tail.slice(0, 30000) + '\n```\n\n';
                } catch (error) {
                  core.warning(`Unable to read frontend test log: ${describeError(error)}`);
                  body += '### Tests\n\n_Failed (logs unavailable)_\n\n';
                }
              }

              return body;
            }

            function renderRustLogSection(heading, logPath, warningLabel) {
              let section = `${heading}\n\n`;
              try {
                const log = fs.readFileSync(logPath, 'utf8');
                section += '```\n' + log.slice(-30000) + '\n```\n\n';
              } catch (error) {
                core.warning(`Unable to read ${warningLabel} log: ${describeError(error)}`);
                section += '_Failed (logs unavailable)_\n\n';
              }
              return section;
            }

            function renderRustComment(formatFailed, clippyFailed, testsFailed) {
              let body = '## ❌ Rust CI Failures\n\n';

              if (formatFailed) {
                body += renderRustLogSection('### Formatting', '/tmp/rust-logs/rust-format.log', 'Rust formatting');
              }

              if (clippyFailed) {
                body += renderRustLogSection('### Clippy', '/tmp/rust-logs/rust-clippy.log', 'Rust Clippy');
              }

              if (testsFailed) {
                body += '### Tests\n\n';
                try {
                  const log = fs.readFileSync('/tmp/rust-logs/rust-tests.log', 'utf8');
                  const lines = log.split('\n');
                  const errorLines = lines.filter(l =>
                    l.includes('error[') || l.includes('error:') ||
                    l.includes('FAILED') || l.includes('panicked')
                  );
                  const tail = lines.slice(Math.max(0, lines.length - 100)).join('\n');
                  const errors = errorLines.length > 0 ? errorLines.join('\n') + '\n\n---\n\n' + tail : tail;
                  body += '```\n' + errors.slice(0, 30000) + '\n```\n';
                } catch (error) {
                  core.warning(`Unable to read rust test log: ${describeError(error)}`);
                  body += '_Failed (logs unavailable)_\n';
                }
              }

              return body;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            async function syncComment({ marker, failed, body, maxLength }) {
              const existing = comments.find(comment => comment.body.startsWith(marker));

              if (!failed) {
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                }
                return;
              }

              let markedBody = marker + '\n' + body;
              if (maxLength) {
                markedBody = markedBody.slice(0, maxLength);
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: markedBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: markedBody,
                });
              }
            }

            const frontendTypecheckFailed = readExitCodeFile('/tmp/frontend-results/typecheck-exit-code', 'frontend typecheck');
            const frontendTestsFailed = readExitCodeFile('/tmp/frontend-results/tests-exit-code', 'frontend tests');
            const rustFormatFailed = readExitCodeFile('/tmp/rust-results/format-exit-code', 'Rust formatting');
            const rustClippyFailed = readExitCodeFile('/tmp/rust-results/clippy-exit-code', 'Rust Clippy');
            const rustTestsFailed = readExitCodeFile('/tmp/rust-results/tests-exit-code', 'Rust test');

            await syncComment({
              marker: '<!-- ci-frontend-failures -->',
              failed: frontendTypecheckFailed || frontendTestsFailed,
              body: renderFrontendComment(frontendTypecheckFailed, frontendTestsFailed),
            });

            await syncComment({
              marker: '<!-- ci-rust-failures -->',
              failed: rustFormatFailed || rustClippyFailed || rustTestsFailed,
              body: renderRustComment(rustFormatFailed, rustClippyFailed, rustTestsFailed),
              maxLength: 65000,
            });
