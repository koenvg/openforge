name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.9"
  FLUTTER_CHANNEL: stable

jobs:
  frontend:
    name: Frontend Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build built-in plugins
        id: plugin_build
        run: |
          set +e -o pipefail
          pnpm build:plugins 2>&1 | tee /tmp/plugin-build.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build root app
        id: app_build
        run: |
          set +e -o pipefail
          pnpm build 2>&1 | tee /tmp/app-build.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Type check
        id: typecheck
        run: |
          set +e -o pipefail
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/typecheck.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Lint
        id: lint
        run: |
          set +e -o pipefail
          (pnpm mobile:contract:check && pnpm lint) 2>&1 | tee /tmp/lint.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        run: |
          set +e -o pipefail
          pnpm test 2>&1 | tee /tmp/tests.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-logs
          path: |
            /tmp/plugin-build.log
            /tmp/app-build.log
            /tmp/typecheck.log
            /tmp/lint.log
            /tmp/tests.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save results
        if: always()
        run: |
          mkdir -p /tmp/ci-results
          echo "${{ steps.plugin_build.outputs.exit_code }}" > /tmp/ci-results/plugin-build-exit-code
          echo "${{ steps.app_build.outputs.exit_code }}" > /tmp/ci-results/app-build-exit-code
          echo "${{ steps.typecheck.outputs.exit_code }}" > /tmp/ci-results/typecheck-exit-code
          echo "${{ steps.lint.outputs.exit_code }}" > /tmp/ci-results/lint-exit-code
          echo "${{ steps.tests.outputs.exit_code }}" > /tmp/ci-results/tests-exit-code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-results
          path: /tmp/ci-results/
          retention-days: 1

      - name: Fail if checks failed
        if: steps.plugin_build.outputs.exit_code != '0' || steps.app_build.outputs.exit_code != '0' || steps.typecheck.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0' || steps.tests.outputs.exit_code != '0'
        run: exit 1

  terminal-presentation:
    name: Terminal Presentation Conformance
    timeout-minutes: 10
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run terminal presentation conformance
        run: pnpm terminal:presentation

      - name: Upload terminal presentation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: terminal-presentation-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/terminal-presentation
          retention-days: 7
          if-no-files-found: warn

  npm-packages:
    name: NPM Package Readiness
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check publishable package readiness coverage
        id: package_readiness_coverage
        run: |
          set +e -o pipefail
          pnpm test scripts/package-scripts.test.mjs 2>&1 | tee /tmp/npm-package-readiness-coverage.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build package workspaces
        id: package_build
        run: |
          set +e -o pipefail
          pnpm packages:build 2>&1 | tee /tmp/npm-package-build.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Test package workspaces
        id: package_tests
        run: |
          set +e -o pipefail
          pnpm packages:test 2>&1 | tee /tmp/npm-package-tests.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check packed Plugin SDK authoring contract
        id: package_contract
        run: |
          set +e -o pipefail
          pnpm packages:contract:check 2>&1 | tee /tmp/npm-package-contract.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Pack publishable packages dry-run
        id: package_pack
        run: |
          set +e -o pipefail
          pnpm packages:pack:dry-run 2>&1 | tee /tmp/npm-package-pack.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-package-logs
          path: |
            /tmp/npm-package-readiness-coverage.log
            /tmp/npm-package-build.log
            /tmp/npm-package-tests.log
            /tmp/npm-package-contract.log
            /tmp/npm-package-pack.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save results
        if: always()
        run: |
          mkdir -p /tmp/ci-results
          echo "${{ steps.package_readiness_coverage.outputs.exit_code }}" > /tmp/ci-results/package-readiness-coverage-exit-code
          echo "${{ steps.package_build.outputs.exit_code }}" > /tmp/ci-results/package-build-exit-code
          echo "${{ steps.package_tests.outputs.exit_code }}" > /tmp/ci-results/package-tests-exit-code
          echo "${{ steps.package_contract.outputs.exit_code }}" > /tmp/ci-results/package-contract-exit-code
          echo "${{ steps.package_pack.outputs.exit_code }}" > /tmp/ci-results/package-pack-exit-code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-package-results
          path: /tmp/ci-results/
          retention-days: 1

      - name: Fail if package checks failed
        if: steps.package_readiness_coverage.outputs.exit_code != '0' || steps.package_build.outputs.exit_code != '0' || steps.package_tests.outputs.exit_code != '0' || steps.package_contract.outputs.exit_code != '0' || steps.package_pack.outputs.exit_code != '0'
        run: exit 1

  mobile-checks:
    name: Mobile Companion Checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Check Flutter companion
        run: ./scripts/mobile-companion check

  mobile-builds:
    name: Mobile Companion ${{ matrix.name }} Build
    timeout-minutes: 25
    needs: mobile-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            runner: ubuntu-latest
            command: build-android
          - name: iOS
            runner: macos-14
            command: build-ios
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Build companion
        run: ./scripts/mobile-companion ${{ matrix.command }}

  ghostty-compatibility:
    name: Ghostty Compatibility (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-14
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare Ghostty build dependencies
        uses: ./.github/actions/prepare-ghostty
      - name: Build and run the compatibility gate offline
        working-directory: src-tauri
        shell: bash
        run: 'cargo test --manifest-path ghostty-compat/Cargo.toml --locked --offline terminal_model::'

  rust:
    name: Rust Tests
    timeout-minutes: 30
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Resolve backend layout
        id: backend-layout
        run: echo "backend-crate-root=$(node scripts/rust-sidecar-layout.mjs backend-crate-root)" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare Ghostty build dependencies
        uses: ./.github/actions/prepare-ghostty
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.backend-layout.outputs.backend-crate-root }} -> target
          cache-bin: false

      - name: Check Rust formatting
        id: format
        working-directory: ${{ steps.backend-layout.outputs.backend-crate-root }}
        run: |
          set +e -o pipefail
          cargo fmt -- --check 2>&1 | tee /tmp/rust-format.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run Clippy
        id: clippy
        working-directory: ${{ steps.backend-layout.outputs.backend-crate-root }}
        run: |
          set +e -o pipefail
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/rust-clippy.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        working-directory: ${{ steps.backend-layout.outputs.backend-crate-root }}
        run: |
          set +e -o pipefail
          cargo test 2>&1 | tee /tmp/rust-tests.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-logs
          path: |
            /tmp/rust-format.log
            /tmp/rust-clippy.log
            /tmp/rust-tests.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save results
        if: always()
        run: |
          mkdir -p /tmp/ci-results
          echo "${{ steps.format.outputs.exit_code }}" > /tmp/ci-results/format-exit-code
          echo "${{ steps.clippy.outputs.exit_code }}" > /tmp/ci-results/clippy-exit-code
          echo "${{ steps.tests.outputs.exit_code }}" > /tmp/ci-results/tests-exit-code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-results
          path: /tmp/ci-results/
          retention-days: 1

      - name: Fail if checks failed
        if: steps.format.outputs.exit_code != '0' || steps.clippy.outputs.exit_code != '0' || steps.tests.outputs.exit_code != '0'
        run: exit 1

  packaged-electron-smoke:
    name: Packaged Electron Smoke
    timeout-minutes: 20
    runs-on: macos-14
    needs: [frontend, npm-packages, rust]
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      npm_config_arch: arm64
    steps:
      - uses: actions/checkout@v6

      - name: Resolve backend layout
        id: backend-layout
        run: echo "backend-crate-root=$(node scripts/rust-sidecar-layout.mjs backend-crate-root)" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.backend-layout.outputs.backend-crate-root }} -> target
          cache-bin: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare Ghostty build dependencies
        uses: ./.github/actions/prepare-ghostty
      - name: Install frontend dependencies
        run: pnpm install

      - name: Package Electron app
        id: package_app
        run: |
          set +e -o pipefail
          pnpm electron:package 2>&1 | tee /tmp/packaged-smoke-package.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Smoke test packaged Electron app
        id: smoke
        if: steps.package_app.outputs.exit_code == '0'
        run: |
          set +e -o pipefail
          pnpm electron:smoke:packaged --skip-package 2>&1 | tee /tmp/packaged-smoke.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload failure logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-electron-smoke-logs
          path: |
            /tmp/packaged-smoke-package.log
            /tmp/packaged-smoke.log
          retention-days: 1
          if-no-files-found: ignore

      - name: Save results
        if: always()
        run: |
          mkdir -p /tmp/ci-results
          echo "${{ steps.package_app.outputs.exit_code }}" > /tmp/ci-results/package-exit-code
          echo "${{ steps.smoke.outputs.exit_code }}" > /tmp/ci-results/smoke-exit-code

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: packaged-electron-smoke-results
          path: /tmp/ci-results/
          retention-days: 1

      - name: Fail if checks failed
        if: steps.package_app.outputs.exit_code != '0' || steps.smoke.outputs.exit_code != '0'
        run: exit 1
