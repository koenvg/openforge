name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            electron_arch: arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            electron_arch: x64
    timeout-minutes: 20
    runs-on: ${{ matrix.platform }}
    env:
      SOURCE_DATE_EPOCH: "1"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      npm_config_arch: ${{ matrix.electron_arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve backend layout
        id: backend-layout
        run: echo "backend-crate-root=$(node scripts/rust-sidecar-layout.mjs backend-crate-root)" >> "$GITHUB_OUTPUT"

      - name: Set version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Updating version to $VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          CARGO_MANIFEST_PATH="$(node scripts/rust-sidecar-layout.mjs manifest-path)"
          sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" "$CARGO_MANIFEST_PATH"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ steps.backend-layout.outputs.backend-crate-root }} -> target
          cache-bin: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Package Electron app
        run: pnpm electron:package

      - name: Build release DMG image
        id: release-image
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          APP_PATH="$(node scripts/rust-sidecar-layout.mjs electron-app-path)"
          DMG_PATH="$(node scripts/release-image.mjs create "$APP_PATH" "$VERSION" "${{ matrix.target }}")"
          echo "dmg-path=$DMG_PATH" >> "$GITHUB_OUTPUT"
          echo "dmg-name=$(basename "$DMG_PATH")" >> "$GITHUB_OUTPUT"

      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-image.outputs.dmg-name }}
          path: ${{ steps.release-image.outputs.dmg-path }}

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          name: Open Forge ${{ github.ref_name }}
          body: |
            See the assets to download and install this version.

            **macOS:** If you see _"Open Forge is damaged and can't be opened"_, run this after copying the app to Applications:
            ```
            xattr -rd com.apple.quarantine /Applications/Open\ Forge.app
            ```
          files: ${{ steps.release-image.outputs.dmg-path }}

  publish-plugin-sdk:
    name: Publish @openforge-app/plugin-sdk to npm
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set SDK package version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Invalid semver version: $VERSION" >&2
            exit 1
          fi
          jq --arg v "$VERSION" '.version = $v' packages/plugin-sdk/package.json > packages/plugin-sdk/package.json.tmp
          mv packages/plugin-sdk/package.json.tmp packages/plugin-sdk/package.json

      - name: Build plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk build

      - name: Test plugin SDK
        run: pnpm --filter @openforge-app/plugin-sdk test

      - name: Check published SDK version
        id: published-sdk
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('packages/plugin-sdk/package.json', 'utf8')).version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@openforge-app/plugin-sdk@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@openforge-app/plugin-sdk@$PACKAGE_VERSION is already published; publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace package license metadata
        run: pnpm packages:metadata:check

      - name: Check package contents
        working-directory: packages/plugin-sdk
        run: npm pack --dry-run

      - name: Publish package
        if: steps.published-sdk.outputs.published != 'true'
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance --tag latest
